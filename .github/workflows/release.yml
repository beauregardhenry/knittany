name: Test or publish release

# Run by hand for a release candidate (the packaged app is attached to the run), or by pushing an
# annotated tag like v0.1.0 to test, package, attest and publish a GitHub release. The tag must
# match the app's version (MARKETING_VERSION in App/project.yml), and
# "DistributionAssets/RELEASE NOTES - Knittany <version>.md" must exist.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native-tests:
    name: Native tests · ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run tests on native hardware
        timeout-minutes: 15
        working-directory: KnitCore
        run: swift test --disable-sandbox
      - name: Build the native release command-line tool
        working-directory: KnitCore
        run: swift build --configuration release --arch "${{ matrix.architecture }}" --disable-sandbox

  universal-package:
    name: Universal package and integrity checks
    needs: native-tests
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate the release tag and metadata
        if: github.event_name == 'push'
        run: |
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must be an annotated tag." >&2
            exit 1
          fi

          version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' App/project.yml)"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match application version '$expected_tag'." >&2
            exit 1
          fi

          release_notes="DistributionAssets/RELEASE NOTES - Knittany ${version}.md"
          if [[ ! -f "$release_notes" ]]; then
            echo "Release notes are missing at '$release_notes'." >&2
            exit 1
          fi
      - name: Build ZIP, DMG, and checksums
        run: ./scripts/package-release.sh
      - name: Read packaged version
        id: packaged-version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Knittany.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"
      - name: Verify universal app and release assets
        run: ./scripts/verify-release.sh dist/Knittany.app --release-assets
      - name: Attest release build provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/releases/*.zip
            dist/releases/*.dmg
            dist/releases/*.spdx.json
            dist/releases/SHA256SUMS.txt
      - name: Attest the release SBOM
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/releases/*.zip
            dist/releases/*.dmg
          sbom-path: dist/releases/Knittany-${{ steps.packaged-version.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: Knittany-release-candidate
          path: |
            dist/releases/*.zip
            dist/releases/*.dmg
            dist/releases/*.spdx.json
            dist/releases/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: universal-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Knittany-release-candidate
          path: dist/releases
      - name: Create the versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_notes="DistributionAssets/RELEASE NOTES - Knittany ${version}.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/releases/*.zip \
            dist/releases/*.dmg \
            dist/releases/*.spdx.json \
            dist/releases/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Knittany ${version}" \
            --notes-file "$release_notes"
