name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift tests and app bundle
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Check for banned patterns
        run: ./scripts/check-banned-patterns.sh
      - name: Check the test count ratchet
        run: ./scripts/check-test-count.sh
      - name: Run the tests and check the coverage ratchet
        run: ./scripts/check-coverage.sh
      - name: Verify the checked-in Xcode project matches the sources
        run: ./scripts/verify-xcode-project.sh
      - name: Build the universal application
        run: ./scripts/build-app.sh
      - name: Verify the application bundle
        run: ./scripts/verify-release.sh dist/Knittany.app

  intel-tests:
    name: Swift tests on Intel
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run the tests on Intel hardware
        working-directory: KnitCore
        run: swift test --disable-sandbox
