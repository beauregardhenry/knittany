# Generate Knittany.xcodeproj with: xcodegen generate (run in this folder)
name: Knittany
options:
  bundleIdPrefix: com.beauregardhenry
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KnitCore:
    path: ../KnitCore
targets:
  Knittany:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        # Open a pattern PDF with Knittany (or drop it on the Dock icon) to import it.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF pattern
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    dependencies:
      - package: KnitCore
        product: KnitCore
      - package: KnitCore
        product: KnitRender
      - package: KnitCore
        product: KnitImport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.knittany
        PRODUCT_NAME: Knittany
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Knittany
        # Drawn by Icon/make_icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing until the Apple Developer account exists (phase 6).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          # Universal: Intel and Apple Silicon.
          ARCHS: "$(ARCHS_STANDARD)"
          ONLY_ACTIVE_ARCH: NO
